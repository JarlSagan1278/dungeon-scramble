# Website (dungeonscramble.com: home, /press, /privacy) -- Nov 5, 2026.
# Rebuilds dist/site with tools/site.js and deploys it to the "dungeonscramble" Cloudflare Pages project whenever the
# site's sources change on main (or by hand: Actions tab > Website > Run workflow).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  -- a Cloudflare API token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID -- the account ID (Cloudflare dashboard, Workers & Pages, right-hand column)
name: Website
on:
  push:
    branches: [main]
    paths:
      - docs/release/presskit.html
      - docs/release/privacy.html
      - docs/release/site_media/**
      - tools/site.js
      - .github/workflows/site.yml
  workflow_dispatch:
concurrency:
  group: website
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node tools/site.js
      - name: Waiting for the Cloudflare secrets
        if: env.HAS_TOKEN == ''
        run: echo "::notice::Built, not deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to turn on deploys."
      # Wrangler runs from the runner's temp folder, not the repo: installing it inside the repo makes npm resolve the
      # game's package.json (dev tools pinned there), which broke the first deploy (Nov 5).
      # The account ID is the 32 hex characters inside the secret, so a stray space or a pasted dashboard URL still works.
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN != ''
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT_ID" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -n 1)"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID has no 32-character account ID in it (it is shown in the Cloudflare dashboard URL and on the Workers & Pages overview)."; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/dist/site" --project-name=dungeonscramble --branch=main --commit-dirty=true
